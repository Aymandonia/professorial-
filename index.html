function validateInput(value,max,input,key){let valid=value===''||(Number.isFinite(Number(value))&&+value>=0&&+value<=max);input?.setAttribute('aria-invalid',String(!valid));let error=document.getElementById('error_'+key);if(error)error.textContent=valid?'':`الحد المسموح من 0 إلى ${max}. لم يُحفظ هذا الإدخال.`;return valid}
function setGrade(k,value,max,input){if(!validateInput(value,max,input,k))return;let g=ensureGrade();g.months[ui.month]??={};g.months[ui.month][k]=value===''?'':Number(value);save();updateGradeScore();updateAnnualOutcome()}

function reportRecord(){let value=ownValue(ownValue(ownValue(ownValue(db.reports,ui.classId),ui.subject),ui.studentId),ui.month);return isDataRecord(value)?value:{}}
const reportFields=[['written','الامتحان التحريري'],['daily','الامتحان اليومي'],['prep','التحضير اليومي'],['homework','دفتر الواجبات'],['behavior','السلوك والنشاط']];
function generatedReport(){let s=student(),m=gradesFor(ui.studentId).months?.[ui.month]||{},forLabels={written:'للامتحان التحريري',daily:'للامتحان اليومي',prep:'للتحضير اليومي',homework:'لدفتر الواجبات',behavior:'للسلوك والنشاط'};return reportFields.map(([k,l])=>{let v=m[k];if(v===undefined||v===null||v==='')return `لم تُسجَّل لـ ${s.name} درجة ${forLabels[k]} هذا الشهر.`;if(v==='غ')return `تغيّب ${s.name} عن ${l}، واحتُسبت الدرجة صفرًا.`;return `حصل ${s.name} في ${l} على ${v} درجة.`}).join('\n')}
function attendanceVerdict(a){return a['حاضر']+a['غائب']+a['مجاز']===0?'لم تُسجّل بيانات حضور بعد':a['غائب']===0?'مواظب على الحضور':a['غائب']<=2?'مواظب على الحضور مع غياب محدود':'يحتاج إلى تحسين المواظبة'}

function reportBody(){let r=reportRecord(),m=gradesFor(ui.studentId).months?.[ui.month]||{},a=attendanceCounts(ui.studentId);return `<button class="report-identity report-identity-button" onclick="attendanceHistory(ui.studentId)" aria-label="سجل غياب ${esc(student().name)}"><span class="avatar">${esc(student().name[0])}</span><span class="grow"><h2>${esc(student().name)}</h2><span class="hint">${esc(ui.subject)} · ${months[ui.month]}</span></span>${icon('chevron')}</button><div class="report-send" id="reportSend">${whatsappLink(student(),'report')}</div><div class="card"><div class="subheading">${icon('grades')}<h2>تفاصيل الدرجات</h2></div><div class="scroll"><table><thead><tr><th>عنصر التقييم</th><th>الدرجة المسجّلة</th></tr></thead><tbody>${reportFields.map(([k,l])=>`<tr><td>${l}</td><td>${m[k]==='غ'?'<span class="fail">غائب · صفر</span>':fmt(val(m[k]))}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><div class="row between"><div class="subheading" style="margin:0">${icon('report')}<h2>تقرير الأداء</h2></div><button class="text-btn" onclick="resetReport()">إعادة التوليد</button></div><p class="hint" style="margin:5px 0 12px">نص من الدرجات الفعلية، ويمكنك تعديله مباشرة.</p><textarea data-auto class="report-textarea" aria-label="تقرير الأداء" oninput="saveReport('performance',this.value);resizeText(this)">${esc(r.performance??generatedReport())}</textarea></div><div class="card"><div class="subheading">${icon('calendar')}<h2>المواظبة والحضور</h2></div><div class="metric-grid"><div class="metric"><b>${a['حاضر']}</b><span>أيام حضور</span></div><div class="metric danger"><b>${a['غائب']}</b><span>أيام غياب</span></div><div class="metric"><b>${a['مجاز']}</b><span>أيام إجازة</span></div></div><span class="pill">${attendanceVerdict(a)}</span><button class="text-btn full small-top" onclick="attendanceHistory(ui.studentId)">${icon('calendar')} تفاصيل الغياب والإجازات</button><p class="hint small-top">لجميع التواريخ المسجّلة · العطلات: ${a['عطلة']}</p></div><div class="card"><h2 style="margin-bottom:12px">نقاط تحتاج إلى تحسين</h2><textarea aria-label="نقاط تحتاج إلى تحسين" placeholder="اكتب توصياتك للطالب وخطوات التحسين..." oninput="saveReport('improvements',this.value)">${esc(r.improvements||'')}</textarea></div>`}
function saveReport(k,value){let r=ownMap(ownMap(ownMap(ownMap(db.reports,ui.classId),ui.subject),ui.studentId),ui.month);r[k]=value;if(!save())return;let link=document.getElementById('reportSend');if(link)link.innerHTML=whatsappLink(student(),'report')}
function resetReport(){if(reportRecord().performance!==undefined&&!confirm('إعادة التوليد ستستبدل النص المعدّل بتقرير من الدرجات الحالية. هل تريد المتابعة؟'))return;let r=reportRecord();delete r.performance;save();render()}

esson${i}" placeholder="اسم المادة" value="${esc(d.subjects[i]||'')}" oninput="setLesson(${i},this.value)"></div></div></div></div>`).join(''):`<div class="empty" style="padding-bottom:10px"><div class="empty-icon">${icon('clock')}</div><h2>يوم بلا محاضرات</h2><p>استخدم زر الزيادة لإضافة محاضرة.</p></div>`}</div>${!db.classes.length?`<button class="text-btn full" onclick="go('classes')">أضف الصفوف والشعب لتعيينها للمحاضرات</button>`:''}`:weeklyScheduleGrid()}`}
function chooseDay(i){let scroll=document.querySelector('.days')?.scrollLeft||0;ui.scheduleDay=i;render();let days=document.querySelector('.days');if(days)days.scrollLeft=scroll;document.querySelector('.day-btn.active')?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'})}
function setScheduleCount(n){if(!Number.isInteger(n)||n<0||n>12)return;let scroll=document.querySelector('.days')?.scrollLeft||0;db.schedule[ui.scheduleDay]??={count:0,subjects:[]};db.schedule[ui.scheduleDay].count=n;save();render();if(document.querySelector('.days'))document.querySelector('.days').scrollLeft=scroll}
function setLesson(i,value){db.schedule[ui.scheduleDay]??={count:0,subjects:[]};db.schedule[ui.scheduleDay].subjects??=[];db.schedule[ui.scheduleDay].subjects[i]=value;save()}
function settings(){let p=db.profile;return `<div class="preference-label">الملف المدرسي</div><div class="preferences"><button class="preference-row" onclick="editSchoolProfile()">${icon('users')}<span class="grow"><strong>${esc(p.teacher||'اسم المعلم')}</strong><small>تعديل بيانات المعلم والمدرسة</small></span><span class="chevron">${icon('edit')}</span></button>${[['المدرسة',p.school],['المدير',p.principal],['المرحلة',p.type]].map(([l,v])=>`<div class="preference-value"><span>${l}</span><b>${esc(v||'لم يسجل')}</b></div>`).join('')}</div><div class="preference-label">الدرجات</div><div class="preferences"><button class="preference-row" onclick="examSystemSheet()">${icon('grades')}<span class="grow"><strong>نظام الامتحان</strong><small>${systems[p.system]}</small></span><span class="chevron">${icon('chevron')}</span></button><details class="preference-expand"><summary>${icon('report')}<span class="grow"><strong>نسب الدرجة النهائية</strong><small>السعي ${p.annualWeight}٪ · الامتحان النهائي ${p.finalWeight}٪</small></span><span class="expand-icon">${icon('chevron')}</span></summary><div class="preference-content"><div class="two-cols"><div class="field"><label for="annualWeight">السعي السنوي ٪</label><input type="number" id="annualWeight" min="0" max="100" value="${p.annualWeight}"></div><div class="field"><label for="finalWeight">الامتحان النهائي ٪</label><input type="number" id="finalWeight" min="0" max="100" value="${p.finalWeight}"></div></div><p class="hint gap-top">مجموع النسبتين يجب أن يكون 100٪.</p><button class="outline full gap-top" onclick="saveWeights()">حفظ</button></div></details></div><div class="preference-label">حساب السعي والمعدلات</div><div class="preferences"><div class="preference-row"><div class="grow"><strong>احتساب نصف السنة ضمن السعي السنوي</strong><small>متوسط الفصلين ونصف السنة عند التفعيل</small></div><button class="switch ${p.includeMid?'active':''}" role="switch" aria-checked="${p.includeMid}" aria-label="احتساب نصف السنة ضمن السعي السنوي" onclick="setPolicy('includeMid',!db.profile.includeMid)"></button></div><div class="preference-row"><div class="grow"><strong>جبر الكسور لأقرب عدد صحيح</strong><small>للنتائج المحسوبة، مع إبقاء الدرجات الأصلية</small></div><button class="switch ${p.roundGrades?'active':''}" role="switch" aria-checked="${p.roundGrades}" aria-label="جبر الكسور لأقرب عدد صحيح" onclick="setPolicy('roundGrades',!db.profile.roundGrades)"></button></div><div class="preference-content policy-months"><div class="two-cols">${[0,1].map(term=>`<div class="field"><label for="semesterMonths${term}">${term===0?'أشهر الفصل الأول':'أشهر الفصل الثاني'}</label><select id="semesterMonths${term}" onchange="setPolicy('${term===0?'firstSemesterMonths':'secondSemesterMonths'}',this.value)">${[['2','شهران'],['3','ثلاثة أشهر'],['recorded','الأشهر المرصودة']].map(([v,t])=>`<option value="${v}" ${semesterMode(term)===v?'selected':''}>${t}</option>`).join('')}</select></div>`).join('')}</div><p class="hint small-top">«الأشهر المرصودة» يحتسب الأشهر التي اكتملت حقولها فقط. خيار الشهرين يحتسب أول شهرين من الفصل.</p></div></div><div class="preference-label">المظهر</div><div class="preferences"><div class="preference-row">${icon('moon')}<div class="grow"><strong>الوضع الداكن</strong></div><button class="switch ${p.theme==='dark'?'active':''}" role="switch" aria-checked="${p.theme==='dark'}" aria-label="الوضع الداكن" onclick="toggleTheme()"></button></div><button class="preference-row theme-preference" onclick="go('themes')">${icon('settings')}<span class="grow"><strong>ثيمات الألوان</strong><small>ألوان موسمية وثيمات حصرية</small></span>${premiumMark()}<span class="chevron">${icon('chevron')}</span></button></div>${accountSettings()}`}
function saveWeights(){let a=document.getElementById('annualWeight').value,b=document.getElementById('finalWeight').value;if(a===''||b===''||!Number.isFinite(+a)||!Number.isFinite(+b)||+a<0||+b<0||+a>100||+b>100||Math.abs(+a + +b-100)>.00001)return toast('أدخل نسبتين بين 0 و100، مجموعهما 100٪.');db.profile.annualWeight=+a;db.profile.finalWeight=+b;if(!save())return;let label=document.querySelector('.preference-expand summary small');if(label)label.textContent=`السعي ${+a}٪ · الامتحان النهائي ${+b}٪`;toast('تم حفظ نسب الحساب')}

function editSchoolProfile(){let p=db.profile;showModal(`${modalHead('بيانات المدرسة')}<form onsubmit="saveSchoolProfile(event)"><div class="stack">${formField('teacher','اسم المعلم',p.teacher,'اسمك الكامل',true)}${formField('school','اسم المدرسة',p.school,'اسم المدرسة',true)}${formField('principal','اسم المدير',p.principal,'اسم المدير',true)}<div class="field"><label for="schoolType">نوع المدرسة</label><select id="schoolType" name="type">${['ابتدائي','متوسط','إعدادي'].map(t=>`<option ${p.type===t?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="modal-actions"><button type="button" class="outline" onclick="closeModal()">إلغاء</button><button class="primary">حفظ</button></div></form>`)}
function saveSchoolProfile(e){e.preventDefault();let f=new FormData(e.target);if(!['teacher','school','principal'].every(k=>String(f.get(k)).trim()))return toast('أكمل البيانات المطلوبة');for(let k of ['teacher','school','principal','type'])db.profile[k]=String(f.get(k)).trim();if(!save())return;closeModal();render()}
function examSystemSheet(){showModal(`${modalHead('نظام الامتحان')}<form onsubmit="saveExamSystem(event)"><div class="options">${[['1','تحريري + يومي','90 تحريري + 10 يومي = 100'],['2','متوسط التحريري واليومي','(تحريري 100 + يومي 100) ÷ 2'],['3','التحريري والحقول الأربعة','تحريري من 100 + أربعة حقول من 25، ثم القسمة على 2']].map(([v,t,d])=>`<label class="option"><input type="radio" name="system" value="${v}" ${db.profile.system===v?'checked':''}><span><b>${t}</b><small>${d}</small></span></label>`).join('')}</div><div class="modal-actions"><button type="button" class="outline" onclick="closeModal()">إلغاء</button><button class="primary">حفظ</button></div></form>`)}
function saveExamSystem(e){e.preventDefault();let system=new FormData(e.target).get('system');if(system!==db.profile.system&&Object.keys(db.grades).length&&!confirm('تغيير النظام سيعيد حساب الدرجات. راجع الدرجات السابقة بعد التغيير. هل تريد المتابعة؟'))return;db.profile.system=system;if(!save())return;closeModal();render()}

let focusBeforeModal=null,modalFocusTimer,modalFocusVersion=0;
function focusDescriptor(node){return node instanceof Element?{id:node.id,aria:node.getAttribute('aria-label'),action:node.getAttribute('onclick'),page:node.getAttribute('data-page')}:null}

const activeRipples=new Map();
function startRipple(element,x,y,key){if(!element||element.disabled||element.closest('[inert]'))return;finishRipple(key,true);let rect=element.getBoundingClientRect();if(!rect.width||!rect.height)return;let size=Math.hypot(rect.width,rect.height)*2;let clip=document.createElement('span');clip.className='m3-ripple-clip';clip.setAttribute('aria-hidden','true');let wave=document.createElement('span');wave.className='m3-ripple';wave.style.cssText=`width:${size}px;height:${size}px;left:${x-size/2}px;top:${y-size/2}px`;clip.append(wave);element.append(clip);activeRipples.set(key,{clip,wave,element,started:performance.now(),x:x+rect.left,y:y+rect.top});requestAnimationFrame(()=>wave.classList.add('expanded'))}

function roundComputed(value){return value===null?null:(db.profile.roundGrades?Math.round(value):value)}
function boundedGrade(value,max=100){let n=val(value);return n===null||!Number.isFinite(n)||n<0||n>max?null:n}
function semesterMode(term){return String(db.profile[term===0?'firstSemesterMonths':'secondSemesterMonths']||'3')}
function semesterAverage(values,term){let mode=semesterMode(term),used=mode==='2'?values.slice(0,2):mode==='recorded'?values.filter(x=>x!==null):values;return used.length?avg(used):null}
function monthsPolicyLabel(term){let mode=semesterMode(term);return mode==='2'?'أول شهرين':mode==='recorded'?'الأشهر المكتملة المسجّلة':'ثلاثة أشهر'}
function normalizeDigits(value){return String(value??'').replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632)).replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-1776)).replace(/٫/g,'.').trim()}
function calculated(g){
 const m=Array.from({length:6},(_,i)=>monthly(g.months?.[i],db.profile.system));
 const first=semesterAverage(m.slice(0,3),0),second=semesterAverage(m.slice(3),1);
 const annual=avg(db.profile.includeMid?[first,boundedGrade(g.mid),second]:[first,second]);
 const weighted=exam=>{let v=boundedGrade(exam),a=Number(db.profile.annualWeight),f=Number(db.profile.finalWeight);return a>0&&annual===null||f>0&&v===null?null:roundComputed((a?annual*a/100:0)+(f?v*f/100:0))};
 const firstResult=weighted(g.final),canSecond=firstResult!==null&&firstResult<50;
 const secondResult=canSecond&&boundedGrade(g.secondFinal)!==null?weighted(g.secondFinal):null;
 const usedSecond=secondResult!==null,baseResult=usedSecond?secondResult:firstResult;
 const requested=boundedGrade(g.decision,5),canDecision=baseResult!==null&&baseResult>=45&&baseResult<50;
 const decisionApplied=canDecision&&requested!==null?Math.min(requested,50-baseResult):0;
 const result=baseResult===null?null:roundComputed(baseResult+decisionApplied);
 const status=result===null?'لم تكتمل الدرجات':result>=50?(decisionApplied>0?'ناجح بالقرار':usedSecond?'ناجح في الدور الثاني':'ناجح'):usedSecond?'راسب في الدور الثاني':'مكمل للدور الثاني';
 return{m,first,second,annual,firstResult,secondResult,usedSecond,baseResult,canSecond,canDecision,decisionApplied,result,status};
}

function attendanceMessage(id){let s=students().find(s=>s.id===id),dates=attendanceDates(id,'غائب');return `السلام عليكم، ولي أمر الطالب ${s.name}.\nسُجّل غياب الطالب في ${shortDate(ui.date)} عن الصف ${cls().name} / ${cls().section}.\nتواريخ الغياب المسجّلة: ${dates.map(shortDate).join('، ')}\nالمدرسة: ${db.profile.school}\nالمعلم: ${db.profile.teacher}`}
function whatsappHref(id,kind){let s=students().find(s=>s.id===id),phone=whatsappNumber(s?.phone||'');return phone?`https://wa.me/${phone}?text=${encodeURIComponent(kind==='report'?reportMessage():attendanceMessage(id))}`:''}
function whatsappLink(s,kind,compact=false){let href=whatsappHref(s.id,kind);return href?`<a class="${compact?'icon-btn whatsapp-mini':'outline full whatsapp-button'}" aria-label="${compact?'إرسال إشعار غياب لولي أمر '+esc(s.name):'إرسال لولي الأمر عبر واتساب'}" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${whatsappIcon()}${compact?'':'إرسال لولي الأمر عبر واتساب'}</a>`:`<button class="${compact?'icon-btn whatsapp-mini':'outline full whatsapp-button'}" aria-label="${compact?'إضافة هاتف ولي أمر '+esc(s.name):'إضافة هاتف ولي الأمر للواتساب'}" onclick="toast('أضف رقم ولي الأمر. يبدأ الرقم العراقي بـ07، أو أدخل الرقم الدولي مع +.');studentModal('${s.id}')">${whatsappIcon()}${compact?'':'إضافة هاتف ولي الأمر للواتساب'}</button>`}

// جدول واحد للشعبة: الدرجة الشهرية ومعدلات العام والمعالجة في صف الطالب نفسه.
function classGradesGrid(){
 const fields=gradeFields(),short={written:'تحريري',daily:'يومي',prep:'تحضير',homework:'واجبات',behavior:'سلوك'};
 const widths=[6,48,...fields.map(()=>13),13,13,13,13,13,13,13,10,13,14,30],total=widths.reduce((a,b)=>a+b,0);

 const rows=students().map((s,i)=>{let g=gradesFor(s.id),a=calculated(g),m=g.months?.[ui.month]||{};return[i+1,esc(s.name),...fields.map(([key])=>m[key]==='غ'?'<span class="matrix-absence">غائب · 0</span>':docRaw(m[key])),...[monthly(m,db.profile.system),a.first,boundedGrade(g.mid),a.second,a.annual,boundedGrade(g.final),a.firstResult].map(docScore),docRaw(boundedGrade(g.decision,5)===null?'':a.decisionApplied),docRaw(g.secondFinal),docScore(a.result),esc(a.status)]});
 return docTable(head,rows,widths.map(w=>w/total*100),'doc-class-matrix');

function scheduleColumnCount(indices=scheduleDays.map((_,i)=>i)){return Math.max(0,...indices.map(i=>daySchedule(i).count))}

 const count=scheduleColumnCount();if(!count)return empty('table','لا توجد محاضرات','أضف محاضراتك من الجدول اليومي.',`<button class="primary" onclick="ui.scheduleTab='day';render()">تنظيم المحاضرات</button>`);
 return `<div class="schedule-grid-scroll"><table class="schedule-grid" style="min-width:${80+110*count}px"><thead><tr><th class="day-cell">اليوم</th>${Array.from({length:count},(_,i)=>`<th>المحاضرة ${i+1}</th>`).join('')}</tr></thead><tbody>${scheduleDays.map((day,index)=>{let d=daySchedule(index);return `<tr><th class="day-cell"><button class="day-edit" aria-label="تعديل يوم ${day}" onclick="ui.scheduleTab='day';chooseDay(${index})">${day}</button></th>${Array.from({length:count},(_,i)=>`<td>${i<d.count?`<strong>${esc(d.subjects[i]?.trim()||'لم تُسجّل المادة')}</strong><small>${esc(lessonClassLabel(d.classes[i]))}</small>`:'<span class="muted">—</span>'}</td>`).join('')}</tr>`}).join('')}</tbody></table></div>`;
}
function schedulePdfGrid(indices){

 return docTable(['اليوم',...Array.from({length:count},(_,i)=>`المحاضرة ${i+1}`)],indices.map(index=>{let d=daySchedule(index);return[esc(scheduleDays[index]),...Array.from({length:count},(_,i)=>i<d.count?`<strong>${esc(d.subjects[i]?.trim()||'لم تُسجّل المادة')}</strong><small class="doc-lesson-class">${esc(lessonClassLabel(d.classes[i]))}</small>`:'<span class="missing">—</span>')]}),[10,...Array(count).fill(90/count)],'doc-schedule-grid');

function caseFields(s){return `<fieldset class="case-fieldset"><legend>الفروق الفردية والحالات الخاصة</legend><div class="case-options">${studentCases.map(([key,label])=>`<label><input type="checkbox" name="cases" value="${key}" ${(s.cases||[]).includes(key)?'checked':''}>${label}</label>`).join('')}</div></fieldset>`}

function caseBadges(s){return `<span class="student-flags">${studentCases.filter(([key])=>(s.cases||[]).includes(key)).map(([key,label,short])=>`<span class="case-badge" title="${label}" aria-label="${label}">${caseIcon(key)}<small>${short}</small></span>`).join('')}</span>`}
function subjectContext(){return `<div class="context-panel two-cols">${classSelect()}${subjectSelect()}</div>`}

function curriculum(){if(needsSubject())return subjectEmpty();let r=ownValue(ownValue(db.curriculum,ui.classId),ui.subject)||{};return `${subjectContext()}<div class="card"><div class="subheading">${icon('book')}<h2>أين وصلنا في المادة؟</h2></div><form onsubmit="saveCurriculum(event)"><div class="stack"><div class="field"><label for="curriculumTopic">الموضوع أو الدرس</label><input id="curriculumTopic" name="topic" maxlength="250" placeholder="مثال: جمع الكسور" value="${esc(r.topic||'')}"></div><div class="field"><label for="curriculumPage">رقم الصفحة</label><input id="curriculumPage" name="page" dir="auto" inputmode="numeric" maxlength="30" placeholder="مثال: 42–45" value="${esc(r.page||'')}"></div><div class="field"><label for="curriculumNotes">ملاحظة للدرس القادم</label><textarea id="curriculumNotes" name="notes" maxlength="2000" placeholder="ما الذي تريد إكماله؟">${esc(r.notes||'')}</textarea></div></div><button class="primary full gap-top">${icon('check')} حفظ المتابعة</button></form>${r.updated?`<p class="hint small-top">آخر تحديث: ${esc(readableDate(r.updated))}</p>`:''}</div><h2 class="gap-top">متابعة الشعب</h2><div class="progress-list">${db.classes.filter(c=>c.subjects.includes(ui.subject)).map(c=>{let a=ownValue(ownValue(db.curriculum,c.id),ui.subject)||{};return `<button class="progress-row" onclick="openProgress('${c.id}')"><span class="avatar">${esc(c.section[0]||'—')}</span><span class="grow"><strong>${esc(c.name+' / '+c.section)}</strong><small>${esc(a.topic||'لم يسجل موضوع')}${a.page?' · ص '+esc(a.page):''}</small></span>${icon('chevron')}</button>`}).join('')}</div>`}
function openProgress(id){let subject=ui.subject;ui.classId=id;sync();ui.subject=subject;render();document.getElementById('content').scrollTop=0}
function saveCurriculum(e){e.preventDefault();let f=new FormData(e.target);ownMap(db.curriculum,ui.classId)[ui.subject]={topic:String(f.get('topic')).trim(),page:String(f.get('page')).trim(),notes:String(f.get('notes')).trim(),updated:localDate()};if(!save())return;render();toast('تم حفظ متابعة المنهج')}

// نسبة النجاح تعتمد على النتائج المرصودة، ولا تُحوّل الدرجات الناقصة إلى صفر.
function periodOptions(value){return [...months.map((name,i)=>['month:'+i,name]),['mid','نصف السنة'],['first','نتيجة الدور الأول'],['second','نتيجة الدور الثاني'],['approved','النتيجة السنوية المعتمدة']].map(([v,label])=>`<option value="${v}" ${v===value?'selected':''}>${label}</option>`).join('')}
function periodLabel(value){return value.startsWith('month:')?months[Number(value.split(':')[1])]:({mid:'نصف السنة',first:'نتيجة الدور الأول',second:'نتيجة الدور الثاني',approved:'النتيجة السنوية المعتمدة'}[value]||'النتيجة')}
function examOutcome(g,period){let a=calculated(g),value=null,state='missing';if(period.startsWith('month:'))value=monthly(g.months?.[period.split(':')[1]],db.profile.system);else if(period==='mid')value=boundedGrade(g.mid);else if(period==='first')value=a.firstResult;else if(period==='second')value=a.secondResult;else value=a.result;if(value!==null){state=value>=50?'pass':period==='first'?'deferred':period==='approved'&&!a.usedSecond?'deferred':'fail'}return {value,state,label:{missing:'لم يسجل',pass:'ناجح',deferred:'مكمل',fail:'راسب'}[state]}}
function resultStats(period=ui.statsPeriod){let rows=students().map(s=>({student:s,...examOutcome(gradesFor(s.id),period)})),counts={pass:0,deferred:0,fail:0,missing:0};rows.forEach(r=>counts[r.state]++);let recorded=rows.length-counts.missing;return {rows,...counts,recorded,rate:recorded?counts.pass*100/recorded:null}}
function statsCards(s){return `<div class="admin-rate"><span>نسبة النجاح من النتائج المرصودة</span><strong>${s.rate===null?'—':fmt(s.rate)+'٪'}</strong></div><div class="admin-metrics">${[['pass','ناجح'],['deferred','مكمل'],['fail','راسب'],['missing','لم يسجل']].map(([k,l])=>`<div class="admin-metric ${k}"><b>${s[k]}</b><span>${l}</span></div>`).join('')}</div>`}
function statistics(){if(needsSubject())return subjectEmpty();let s=resultStats();return `${subjectContext()}<div class="field gap-top"><label for="statsPeriod">الامتحان</label><select id="statsPeriod" onchange="ui.statsPeriod=this.value;render()">${periodOptions(ui.statsPeriod)}</select></div><div class="gap-top">${statsCards(s)}</div><div class="card gap-top"><h2>نتائج المادة</h2><div class="scroll"><table><thead><tr><th>الطالب</th><th>الدرجة</th><th>الحالة</th></tr></thead><tbody>${s.rows.map(r=>`<tr><td>${esc(r.student.name)}</td><td>${scoreCell(r.value)}</td><td><span class="result-state ${r.state}">${r.label}</span></td></tr>`).join('')}</tbody></table></div></div>`}

// مواعيد الامتحانات: تنبيه داخل التطبيق، مرتبط بالشعبة والمادة.
function classLabel(id){let c=db.classes.find(c=>c.id===id);return c?c.name+' / '+c.section:'صف محذوف'}
function examDays(date){return Math.round((new Date(date+'T12:00:00')-new Date(localDate()+'T12:00:00'))/86400000)}
function examTiming(e){let n=examDays(e.date);return e.done?'مكتمل':n<0?'تجاوز الموعد':n===0?'اليوم':n===1?'غدًا':'بعد '+n+' أيام'}
function activeExams(){return db.exams.filter(e=>!e.done&&db.classes.some(c=>c.id===e.classId)).sort((a,b)=>a.date.localeCompare(b.date))}
function examCard(e,compact=false){return `<div class="exam-card ${!e.done&&examDays(e.date)<=1?'soon':''}"><div class="row between"><span class="pill">${esc(examTiming(e))}</span><span class="hint">${esc(readableDate(e.date))}</span></div><h3>${esc(e.subject)} · ${esc(classLabel(e.classId))}</h3><p class="exam-scope">${esc(e.scope)}</p>${compact?`<button class="text-btn full" onclick="go('exams')">عرض الموعد ${icon('chevron')}</button>`:`<div class="exam-actions"><button class="text-btn" onclick="examSheet('${e.id}')">${icon('edit')} تعديل</button><button class="text-btn" onclick="finishExam('${e.id}')">${icon(e.done?'box':'circleCheck')} ${e.done?'إعادة فتح':'تم الامتحان'}</button><button class="icon-btn" aria-label="حذف موعد امتحان ${esc(e.subject)}" onclick="deleteExam('${e.id}')">${icon('trash')}</button></div>`}</div>`}
function homeExamReminders(){if(!isPremium())return '';let items=activeExams().filter(e=>examDays(e.date)<=7),e=items.find(e=>examDays(e.date)>=0)||items.at(-1);return e?`<button class="today-row exam-reminder" onclick="go('exams')">${icon('calendar')}<span class="grow"><strong>امتحان ${esc(examTiming(e))} · ${esc(e.subject)}</strong><small>${esc(classLabel(e.classId))} · ${esc(readableDate(e.date))}</small></span><span class="chevron">${icon('chevron')}</span></button>`:''}
function exams(){return !cls()?subjectEmpty():`${classSelect()}<button class="primary full gap-top" onclick="examSheet()">${icon('plus')} إضافة موعد امتحان</button><div class="gap-top">${db.exams.filter(e=>e.classId===ui.classId).sort((a,b)=>Number(a.done)-Number(b.done)||a.date.localeCompare(b.date)).map(e=>examCard(e)).join('')||empty('calendar','لا توجد امتحانات مسجلة','دوّن موعد الامتحان والمادة الداخلة فيه.')}</div>`}
function examSubjects(classId,selected=''){let c=db.classes.find(c=>c.id===classId);return (c?.subjects||[]).map(s=>`<option ${s===selected?'selected':''}>${esc(s)}</option>`).join('')}
function examSheet(id=''){let e=db.exams.find(e=>e.id===id)||{classId:ui.classId,subject:ui.subject,date:localDate(),scope:''};showModal(`${modalHead(id?'تعديل موعد الامتحان':'موعد امتحان جديد')}<form onsubmit="saveExam(event,'${id}')"><div class="stack"><div class="field"><label for="examClass">الصف / الشعبة</label><select name="classId" id="examClass" onchange="document.getElementById('examSubject').innerHTML=examSubjects(this.value)" required>${db.classes.map(c=>`<option value="${c.id}" ${c.id===e.classId?'selected':''}>${esc(classLabel(c.id))}</option>`).join('')}</select></div><div class="field"><label for="examSubject">المادة</label><select name="subject" id="examSubject" required>${examSubjects(e.classId,e.subject)}</select></div><div class="field"><label for="examDate">تاريخ الامتحان</label><input id="examDate" name="date" type="date" value="${esc(e.date)}" required></div><div class="field"><label for="examScope">المادة الداخلة في الامتحان</label><textarea id="examScope" name="scope" maxlength="2000" placeholder="مثال: الفصل الثاني، الصفحات 30–45" required>${esc(e.scope)}</textarea></div></div><div class="modal-actions"><button type="button" class="outline" onclick="closeModal()">إلغاء</button><button class="primary">حفظ الموعد</button></div></form>`)}
function saveExam(e,id){e.preventDefault();let f=new FormData(e.target),c=db.classes.find(c=>c.id===f.get('classId')),date=String(f.get('date')),scope=String(f.get('scope')).trim(),subject=String(f.get('subject')||'');if(!c||!c.subjects.includes(subject)||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(new Date(date+'T12:00:00').getTime())||!scope)return toast('أكمل الشعبة والمادة والتاريخ ومحتوى الامتحان');let old=db.exams.find(e=>e.id===id),record={id:old?.id||uid(),classId:c.id,subject,date,scope,done:old?.done||false};if(old)Object.assign(old,record);else db.exams.push(record);ui.classId=c.id;if(!save())return;closeModal();render()}
function finishExam(id){let e=db.exams.find(e=>e.id===id);if(e){e.done=!e.done;save();render()}}
function deleteExam(id){if(!confirm('حذف موعد الامتحان؟'))return;db.exams=db.exams.filter(e=>e.id!==id);save();render()}

// شهادات تقدير مستمدة من الدرجات الفعلية أو سجل المواظبة.

 for(let node of article.querySelectorAll('h1,h2,h3')){let r=node.getBoundingClientRect(),next=node.nextElementSibling,after=next?.querySelector('thead')||next;if(after){let b=after.getBoundingClientRect();add(r.top-bounds.top,Math.min(b.bottom,b.top+42)-bounds.top)}}
 let walker=article.ownerDocument.createTreeWalker(article,NodeFilter.SHOW_TEXT);while(walker.nextNode()){let node=walker.currentNode;if(!node.textContent.trim())continue;let atomic=node.parentElement?.closest('tr,.doc-header,.doc-meta,.doc-note,.doc-stat,.doc-signatures,.certificate-signatures');if(atomic&&atomic.getBoundingClientRect().height<=height-2)continue;let range=article.ownerDocument.createRange();range.selectNodeContents(node);let lineHeight=parseFloat(article.ownerDocument.defaultView.getComputedStyle(node.parentElement).lineHeight);for(let r of range.getClientRects()){let safeHeight=Math.min(r.height,Number.isFinite(lineHeight)?Math.max(2,lineHeight-2):r.height),center=(r.top+r.bottom)/2-bounds.top;add(center-safeHeight/2,center+safeHeight/2)}}
 let pages=[],start=0;while(start<full-.5){let continued=tables.find(t=>start>=t.top-.5&&start<t.bottom-1),head=continued?continued.html:'',headHeight=continued?continued.headHeight:0,available=height-headHeight,end=Math.min(start+available,full);if(end<full){for(let i=0;i<100;i++){let crossing=regions.filter(r=>r.top<end-.3&&r.bottom>end+.3&&r.top>start+1);if(!crossing.length)break;let next=Math.min(...crossing.map(r=>r.top));if(next>=end-.1)break;end=next}}if(end<=start+1)end=Math.min(start+available,full);pages.push({article:article.outerHTML,start,end,head,headHeight});start=end;if(pages.length>500)throw new Error('المستند كبير جدًا')}return pages}
async function pdfPageImage(page,css,options,index,total,heading){let width=pdfMm(options.width),height=pdfMm(options.height),left=pdfMm(options.left),top=pdfMm(options.top),contentWidth=pdfMm(options.width-options.left-options.right),bodyHeight=page.end-page.start;let root=document.createElement('div');root.setAttribute('dir','rtl');root.style.cssText=`width:${contentWidth}px;height:${bodyHeight+page.headHeight}px;overflow:hidden;background:#fff;color:#1c332d;font:10pt/1.8 Cairo,Arial,sans-serif`;let style=document.createElement('style');style.textContent=css;root.append(style);let body=document.createElement('div');body.innerHTML=`${page.head?`<div style="height:${page.headHeight}px;overflow:hidden">${page.head}</div>`:''}<div style="height:${bodyHeight}px;overflow:hidden"><div style="transform:translateY(-${page.start}px)">${page.article}</div></div>`;root.append(body);let fragment=new XMLSerializer().serializeToString(root),svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${contentWidth}" height="${bodyHeight+page.headHeight}"><foreignObject width="100%" height="100%">${fragment}</foreignObject></svg>`;
 let image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(new Error('تعذّر رسم المستند'));image.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});let scale=2.25,canvas=document.createElement('canvas');canvas.width=Math.round(width*scale);canvas.height=Math.round(height*scale);let ctx=canvas.getContext('2d',{alpha:false});if(!ctx)throw new Error('تعذّر إنشاء الصفحة');ctx.scale(scale,scale);ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.drawImage(image,left,top,contentWidth,bodyHeight+page.headHeight);ctx.fillStyle='#5a7063';ctx.font=`${options.width>210?9:10}px Cairo,Arial,sans-serif`;ctx.direction='rtl';ctx.textAlign='right';ctx.fillText(heading,width-pdfMm(options.right),top-9,contentWidth);ctx.font='11px Cairo,Arial,sans-serif';ctx.fillText(`الصفحة ${index+1} من ${total}`,width-pdfMm(options.right),height-14);ctx.textAlign='left';ctx.fillText('منصة أستاذي',left,height-14);let blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.94));if(!blob)throw new Error('تعذّر حفظ الصفحة');let bytes=new Uint8Array(await blob.arrayBuffer()),size={width:canvas.width,height:canvas.height};canvas.width=1;canvas.height=1;image.src='';return {bytes,...size}}
function pdfUnicode(value){let hex='FEFF';for(let i=0;i<String(value).length;i++)hex+=String(value).charCodeAt(i).toString(16).padStart(4,'0');return '<'+hex+'>'}
function pdfFile(images,options,title,author){let encoder=new TextEncoder(),parts=[],offsets=[0],position=0,put=value=>{let bytes=typeof value==='string'?encoder.encode(value):value;parts.push(bytes);position+=bytes.length},object=(id,values)=>{offsets[id]=position;put(id+' 0 obj\n');for(let v of values)put(v);put('\nendobj\n')};put('%PDF-1.4\n%');put(new Uint8Array([226,227,207,211,10]));let width=options.width*72/25.4,height=options.height*72/25.4,info=3+images.length*3;object(1,['<< /Type /Catalog /Pages 2 0 R /Lang (ar-IQ) >>']);object(2,[`<< /Type /Pages /Count ${images.length} /Kids [${images.map((_,i)=>3+i*3+' 0 R').join(' ')}] >>`]);images.forEach((image,i)=>{let page=3+i*3,img=page+1,content=page+2,stream=`q\n${width.toFixed(3)} 0 0 ${height.toFixed(3)} 0 0 cm\n/Im0 Do\nQ`;object(page,[`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${width.toFixed(3)} ${height.toFixed(3)}] /Resources << /XObject << /Im0 ${img} 0 R >> >> /Contents ${content} 0 R >>`]);object(img,[`<< /Type /XObject /Subtype /Image /Width ${image.width} /Height ${image.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${image.bytes.length} >>\nstream\n`,image.bytes,'\nendstream']);object(content,[`<< /Length ${encoder.encode(stream).length} >>\nstream\n${stream}\nendstream`])});object(info,[`<< /Title ${pdfUnicode(title)} /Author ${pdfUnicode(author)} /Creator (Ostazi) /Producer (Ostazi offline PDF) >>`]);let xref=position;put(`xref\n0 ${info+1}\n0000000000 65535 f \n`);for(let i=1;i<=info;i++)put(String(offsets[i]).padStart(10,'0')+' 00000 n \n');put(`trailer\n<< /Size ${info+1} /Root 1 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF`);return new Blob(parts,{type:'application/pdf'})}
async function downloadPdf(scope='current'){if(pdfDownloading)return;let previousFocus=focusBeforeModal?.isConnected?focusBeforeModal:document.activeElement,previousFocusDescriptor=focusDescriptor(previousFocus);document.activeElement?.blur();if(isPremiumPage(ui.page)&&!isPremium())return go(ui.page);if([...document.querySelectorAll('[aria-invalid="true"]')].some(el=>el.offsetParent!==null))return toast('صحّح الدرجة غير الصالحة قبل التنزيل.');let doc=buildDocument(scope);if(!doc.html.trim())return;const options=pdfOptions(ui.page,scope),heading=(db.profile.school||'منصة أستاذي')+' · '+doc.title,teacher=db.profile.teacher,filename=(doc.title+' - '+(db.profile.school||'منصة أستاذي')+' - '+localDate()).replace(/[\\/:*?"<>|\x00-\x1f]/g,'-').slice(0,170)+'.pdf';pdfDownloading=true;let frame;closeModal();showPdfProgress('لحظات، نرتّب صفحات المستند…');try{let css=pdfCss();frame=await pdfLayout(doc.html,css,pdfMm(options.width-options.left-options.right));let articles=[...frame.contentDocument.querySelectorAll('#pdfPaper > article')];if(!articles.length)throw new Error('لا توجد صفحات للتنزيل');let pages=articles.flatMap(article=>pdfArticlePlan(article,pdfMm(options.height-options.top-options.bottom))),images=[];await document.fonts.load('11px Cairo','المدرسة الصفحة منصة أستاذي 0123456789');for(let i=0;i<pages.length;i++){showPdfProgress(`تجهيز الصفحة ${i+1} من ${pages.length}`);images.push(await pdfPageImage(pages[i],css,options,i,pages.length,heading));await new Promise(resolve=>setTimeout(resolve,0))}let blob=pdfFile(images,options,doc.title,teacher),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=filename;link.style.display='none';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('تم تجهيز ملف PDF للتنزيل')}catch(error){toast('تعذّر تنزيل الملف. حاول مجددًا.');console.error('PDF download:',error)}finally{frame?.remove();hidePdfProgress();pdfDownloading=false;restoreAppFocu function exportAvailable(){if(['classes','attendance'].includes(ui.page))return !!cls()&&students().length>0;if(['grades','reports'].includes(ui.page))return !!cls()&&!!ui.subject&&!!student();if(ui.page==='statistics')return !!cls()&&!!ui.subject&&students().length>0;if(ui.page==='curriculum')return !!cls()&&!!ui.subject;if(ui.page==='exams')return !!cls()&&db.exams.some(e=>e.classId===ui.classId);if(ui.page==='certificates')return !!cls()&&certificateCandidates().length>0;if(ui.page==='schedule')return scheduleColumnCount()>0;return true}
function gradeTabKey(e,tab){let tabs=['entry','summary','bulk'],i=tabs.indexOf(tab);if(e.key==='ArrowLeft')i=(i+1)%tabs.length;else if(e.key==='ArrowRight')i=(i+tabs.length-1)%tabs.length;else if(e.key==='Home')i=0;else if(e.key==='End')i=tabs.length-1;else return;e.preventDefault();setGradeTab(tabs[i]);document.getElementById('gradeTab_'+tabs[i])?.focus()}
function syncMaterialUi(root=document){if(!(root instanceof Element)&&root!==document)return;let selector='button,summary,.option,a[href]',items=[...(root.querySelectorAll?.(selector)||[])];if(root instanceof Element&&root.matches(selector))items.unshift(root);for(let item of items){item.classList.add('sl');item.setAttribute('data-ripple','');if(item.classList.contains('switch')&&!item.querySelector('.switch-track')){let track=document.createElement('span');track.className='switch-track';track.setAttribute('aria-hidden','true');track.innerHTML=`<span class="switch-thumb">${icon('check')}</span>`;item.append(track)}}}
function syncDeviceFrame(){let rect=document.querySelector('.app').getBoundingClientRect(),style=document.documentElement.style;style.setProperty('--frame-top',rect.top+'px');style.setProperty('--frame-inline-start',(document.documentElement.dir==='rtl'?innerWidth-rect.right:rect.left)+'px');style.setProperty('--frame-height',rect.height+'px');style.setProperty('--frame-bottom',(innerHeight-rect.bottom)+'px')}
function startMaterialUi(){syncMaterialUi(document.querySelector('.app'));syncDeviceFrame();let observer=new MutationObserver(records=>{for(let record of records)for(let node of record.addedNodes){if(node.nodeType!==1||node.matches('.m3-ripple-clip,.m3-ripple'))continue;syncMaterialUi(node)}});observer.observe(document.querySelector('.app'),{childList:true,subtree:true});observer.observe(document.getElementById('modalRoot'),{childList:true,subtree:true});window.addEventListener('resize',syncDeviceFrame)}
